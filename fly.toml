# tableau-public-mcp-app: Tableau Public viz を埋め込む MCP Apps サーバー
# デプロイ: fly deploy --ha=false
#   --ha=false 必須。セッションがメモリ保持なので、マシンが2台あると
#   initialize と後続リクエストが別マシンに散って 400 になる。
app = "tableau-public-mcp-app"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
