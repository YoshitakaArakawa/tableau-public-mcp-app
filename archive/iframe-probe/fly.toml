# Fly.io は任意。HTTP トランスポートを公開エンドポイントに載せたいときだけ使う。
# stdio で使うなら不要。app 名は `fly launch` で自分のものに置き換えること。
app = "mcp-apps-iframe-probe"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
