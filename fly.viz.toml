# tableau-public-mcp-app: シンプルな viz 埋め込みサーバー（ChatGPT 等の Web ホスト向け）
# デプロイ: fly deploy -c fly.viz.toml
app = "tableau-public-mcp-app"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.viz"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
